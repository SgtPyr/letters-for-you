name: Build iOS App

on:
  workflow_dispatch:
  push:
    paths:
      - "ios-app/**"
      - ".github/workflows/build-ios.yml"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios-app
          xcodegen generate

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios-app/LettersForYou.xcodeproj \
            -scheme LettersForYou \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO

      - name: Package simulator app
        run: |
          APP_PATH="$(find build/ios/Build/Products -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in the build output."
            find build/ios/Build/Products -maxdepth 4 -print
            exit 1
          fi
          echo "Packaging: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$GITHUB_WORKSPACE/LettersForYou-iOS-Simulator.zip"

      - name: Build for iPhone device
        run: |
          xcodebuild \
            -project ios-app/LettersForYou.xcodeproj \
            -scheme LettersForYou \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO

      - name: Package iPhone device build
        run: |
          APP_PATH="$(find build/ios-device/Build/Products -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No iPhone app bundle found."
            find build/ios-device/Build/Products -maxdepth 4 -print
            exit 1
          fi
          echo "Packaging device build: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$GITHUB_WORKSPACE/LettersForYou-iPhone-Unsigned.zip"

      - name: Package iPhone IPA
        run: |
          APP_PATH="$(find build/ios-device/Build/Products -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No iPhone app bundle found."
            exit 1
          fi

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r "$GITHUB_WORKSPACE/LettersForYou-Unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LettersForYou-Unsigned-IPA
          path: LettersForYou-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload iPhone device build
        uses: actions/upload-artifact@v4
        with:
          name: LettersForYou-iPhone-Unsigned
          path: LettersForYou-iPhone-Unsigned.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LettersForYou-iOS-Simulator
          path: LettersForYou-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 7
