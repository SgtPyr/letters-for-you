name: LettersForYou

options:
  bundleIdPrefix: com.sgtpyr
  deploymentTarget:
    iOS: "16.0"

targets:
  LettersForYou:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sgtpyr.lettersforyou
        PRODUCT_NAME: Letters for You
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Letters for You
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        GENERATE_INFOPLIST_FILE: YES
