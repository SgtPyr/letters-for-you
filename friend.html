<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eee5d5">
    <title>A Little Notebook for You</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
<header class="topbar">
  <div class="brand">little things, kept here.</div>
  <div class="top-caption">A personal notebook</div>
</header>

<main>
  <section class="intro">
    <h1>A little book for you.</h1>
    <p>Some thoughts deserve their own pages.</p>
  </section>

  <div class="book-wrap">
    <div class="book">
      <article class="page" id="page">
        <div class="paper-lines"></div>
        <div class="margin-line"></div>
        <div class="page-inner" id="pageContent"></div>
      </article>
    </div>
  </div>

  <nav class="controls" aria-label="Notebook page controls">
    <button class="btn" id="prevBtn" type="button">← Previous</button>
    <button class="btn primary" id="nextBtn" type="button">Open notebook →</button>
    <div class="progress" id="progress">Cover</div>
  </nav>

  <div class="tools">
    <button class="btn" id="contentsBtn" type="button">Contents</button>
  </div>

  <p class="hint">Your little corner of the world, one page at a time.</p>
</main>

<footer>Made with care, just for you.</footer>

<script src="js/app.js"></script>
</body>
</html>
